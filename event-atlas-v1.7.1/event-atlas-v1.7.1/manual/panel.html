<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Event Atlas</title>
  <link rel="icon" href="atlas.svg" type="image/svg+xml">
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <main>
    <header>
      <div class="brand"><img src="atlas.svg" alt="" width="42" height="42"><div><small>EVENT ATLAS <span id="version"></span></small><h1 data-label="title"></h1></div></div>
      <label><span data-label="language"></span>
        <select id="language"><option value="id">Indonesia</option><option value="en">English</option></select>
      </label>
    </header>
    <section class="card setup">
      <p class="intro" data-label="instructions"></p>
      <div class="fields">
        <label><span data-label="mode"></span>
          <select id="mode"><option value="live" data-label="liveMode"></option><option value="json" data-label="jsonMode"></option></select>
        </label>
        <label id="pairingField"><span data-label="pairing"></span>
          <input id="pairing" type="password" autocomplete="off" spellcheck="false" maxlength="24">
        </label>
      </div>
      <p id="pairingHelp" class="helper"><span data-label="pairingHelp"></span> <a href="http://127.0.0.1:4318/#timeline" target="_blank" rel="noreferrer" data-label="dashboard"></a></p>
      <div class="actions">
        <button id="start" class="primary" data-label="start"></button>
        <button id="pause" data-label="pause" disabled></button>
        <button id="stop" class="stop" data-label="stop" disabled></button>
        <button id="download" data-label="download" disabled></button>
      </div>
    </section>
    <section class="card session">
      <div class="status-row"><p id="status" role="status"></p><span id="connection" role="status" hidden></span></div>
      <p id="page"></p>
      <dl>
      <div><dt data-label="pages"></dt><dd id="pages">0</dd></div>
      <div><dt data-label="clicks"></dt><dd id="clicks">0</dd></div>
      <div><dt data-label="activities"></dt><dd id="activities">0</dd></div>
      <div><dt data-label="events"></dt><dd id="events">0</dd></div>
      </dl>
    </section>
    <section class="card map-capture"><h2 data-map-label="title"></h2><p data-map-label="help"></p><label><span data-map-label="pairing"></span><input id="mapPairing" type="password" autocomplete="off" maxlength="24"></label><div class="actions"><button id="mapSend" class="primary" data-map-label="send"></button><label class="map-auto"><input id="mapAuto" type="checkbox"><span data-map-label="auto"></span></label></div><p id="mapCaptureStatus" role="status"></p><p class="helper" data-map-label="note"></p></section>
    <p class="note" data-label="note"></p>
  </main>
  <script type="module" src="panel.js"></script>
</body>
</html>
